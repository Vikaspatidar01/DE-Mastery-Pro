<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0e1e38"/>
      <stop offset="100%" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="103" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer glowing pipeline ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-dasharray="18 12" opacity="0.4"/>
  
  <!-- Central Badge -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="#0d1b33" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Decorative pipeline nodes -->
  <circle cx="140" cy="140" r="12" fill="#10b981"/>
  <circle cx="372" cy="140" r="12" fill="#06b6d4"/>
  <circle cx="140" cy="372" r="12" fill="#3b82f6"/>
  <circle cx="372" cy="372" r="12" fill="#10b981"/>
  
  <!-- Connecting lines -->
  <path d="M152 140 H360 M140 152 V360 M372 152 V360 M152 372 H360" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Main DE Text -->
  <text x="256" y="295" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="url(#primaryGrad)" letter-spacing="-2px">DE</text>
  <rect x="216" y="325" width="80" height="8" rx="4" fill="#10b981"/>
</svg>